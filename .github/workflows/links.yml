name: Links

# External links rot without any commit; check main's built site every night.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Quoted so lychee expands the glob (the action's bash has no globstar).
          args: >-
            --no-progress
            --max-retries 3
            --accept 200..=299,429
            --root-dir ${{ github.workspace }}/dist
            --fallback-extensions html
            --exclude linkedin\.com
            --exclude '^https://(www\.)?leonardonunez\.dev'
            'dist/**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
