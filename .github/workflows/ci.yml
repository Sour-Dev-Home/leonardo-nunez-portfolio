name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The lanes merge queue tests the merged commit; without this the required `verify` never reports there.
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

      - run: npm run test:dist

  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      PW_VISUAL: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: List existing baselines
        run: |
          mkdir -p e2e/__screenshots__
          find e2e/__screenshots__ -type f | sort > "$RUNNER_TEMP/baselines-before.txt"

      # Changed screenshots fail with a diff. Missing ones are written (Playwright
      # counts that as a pass), so the next step fails the job instead and the
      # artifact below carries the new images in the right folders.
      - run: npx playwright test --update-snapshots=missing

      - name: Fail if any screenshot had no baseline
        run: |
          find e2e/__screenshots__ -type f | sort > "$RUNNER_TEMP/baselines-after.txt"
          new=$(comm -13 "$RUNNER_TEMP/baselines-before.txt" "$RUNNER_TEMP/baselines-after.txt")
          if [ -n "$new" ]; then
            echo "$new"
            echo "::error::These screenshots had no baseline. Download the screenshots artifact into e2e/__screenshots__/, check the images, commit and push."
            exit 1
          fi

      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: e2e/__screenshots__/
          if-no-files-found: ignore

      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      # Traces and videos of failed tests: open with `npx playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      # Lighthouse CI runs through npx at a pinned version rather than as a
      # dependency: its own dependencies carry advisories that would fail npm audit.
      - run: npm run lhci

      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      # LinkedIn answers bots with 999; the token avoids GitHub rate limits, and a
      # 429 after retries counts as reachable. The site's own domain is excluded:
      # its absolute URLs are the canonical and preview tags (checked by the
      # build-output tests), and a new page isn't live until its PR merges. Internal
      # links are root-relative and checked against dist/. The glob is quoted so
      # lychee expands it: the action's bash has no globstar.
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200..=299,429
            --root-dir ${{ github.workspace }}/dist
            --fallback-extensions html
            --exclude linkedin\.com
            --exclude '^https://(www\.)?leonardonunez\.dev'
            'dist/**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The PII and local-path scan moved to lanes' security.yml (the required `security` check); this
  # job keeps the dependency audit, under its own name so the two never share a check name.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
