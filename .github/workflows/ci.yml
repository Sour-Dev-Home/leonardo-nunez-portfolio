name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for PII or hardcoded local paths
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          # Identifying patterns live in the PII_PATTERNS repository SECRET, not in this
          # file, so this public workflow doesn't publish what it protects. It must be a
          # secret, not a variable: Actions prints a step's env: block unmasked at the top
          # of the log, and only secrets are masked. Dependabot runs read a Dependabot
          # secret of the same name. See
          # CLAUDE.md ground rule 3 for this repo's own PII exceptions. Only file:line
          # is ever printed below, never the matched content, so a real hit doesn't
          # get echoed into a public Actions log either. PII_PATTERNS isn't passed to
          # workflows triggered by a fork PR, so that case falls back to a
          # local-path-only check rather than failing or silently skipping.
          EXCLUDE='^(\.github/|.*CLAUDE\.md$)'
          FILES=$(git ls-files | grep -vE "$EXCLUDE" || true)

          PII_HITS=""
          if [ -n "$PII_PATTERNS" ]; then
            PATTERN_FILE=$(mktemp)
            # tr: CRLF would leave "\r" on every pattern so none match; sed: an empty
            # line is an empty fixed string, which matches every line.
            printf '%s\n' "$PII_PATTERNS" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$PATTERN_FILE"
            PII_HITS=$(echo "$FILES" | xargs -r grep -Hn -iF -f "$PATTERN_FILE" 2>/dev/null | cut -d: -f1,2 || true)
          else
            echo "::warning::PII_PATTERNS secret is not available (expected on fork PRs) — skipping identifier check, only checking local paths."
          fi

          PATH_HITS=$(echo "$FILES" | xargs -r grep -Hn -E 'C:\\Users|C:/Users' | cut -d: -f1,2 || true)

          if [ -n "$PII_HITS" ] || [ -n "$PATH_HITS" ]; then
            [ -n "$PII_HITS" ] && echo "$PII_HITS"
            [ -n "$PATH_HITS" ] && echo "$PATH_HITS"
            echo "::error::Found a possible PII or hardcoded-path leak — see CLAUDE.md ground rule 3."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
