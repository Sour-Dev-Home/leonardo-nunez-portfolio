name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

      - run: npm run test:dist

  # One job per viewport (the projects in playwright.config.ts), in parallel. The
  # required check is the `e2e` job below, which waits for all four.
  e2e-shard:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        project: [phone-360, phone-390, tablet-768, desktop-1280]
    env:
      PW_VISUAL: "1"
      PW_BLOB: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: List existing baselines
        run: |
          mkdir -p e2e/__screenshots__
          find e2e/__screenshots__ -type f | sort > "$RUNNER_TEMP/baselines-before.txt"

      # Changed screenshots fail with a diff. Missing ones are written (Playwright
      # counts that as a pass), so the next step fails the job instead and the
      # artifact below carries the new images in the right folders.
      - run: npx playwright test --project=${{ matrix.project }} --update-snapshots=missing

      - name: Fail if any screenshot had no baseline
        run: |
          find e2e/__screenshots__ -type f | sort > "$RUNNER_TEMP/baselines-after.txt"
          new=$(comm -13 "$RUNNER_TEMP/baselines-before.txt" "$RUNNER_TEMP/baselines-after.txt")
          if [ -n "$new" ]; then
            echo "$new"
            echo "::error::These screenshots had no baseline. Download the screenshots artifact into e2e/__screenshots__/, check the images, commit and push."
            exit 1
          fi

      # This viewport's folder only; the `e2e` job puts the four back together.
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots-${{ matrix.project }}
          path: e2e/__screenshots__/${{ matrix.project }}/
          if-no-files-found: ignore

      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: blob-report-${{ matrix.project }}
          path: blob-report/
          if-no-files-found: ignore

      # Traces and videos of failed tests: open with `npx playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore

  # The required check: passes only if every viewport passed. It also merges the
  # shards' screenshots into one `screenshots` artifact (same folders as before)
  # and their reports into one HTML `playwright-report`.
  e2e:
    if: always()
    needs: e2e-shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: screenshots-*
          path: shards/screenshots

      - uses: actions/download-artifact@v7.0.0
        with:
          pattern: blob-report-*
          path: shards/blobs

      - name: Merge the shards
        run: |
          mkdir -p screenshots blob-reports
          for d in shards/screenshots/screenshots-*; do
            [ -d "$d" ] && mv "$d" "screenshots/${d##*/screenshots-}"
          done
          for d in shards/blobs/blob-report-*; do
            for f in "$d"/*.zip; do [ -f "$f" ] && cp "$f" "blob-reports/${d##*/blob-report-}.zip"; done
          done
          if ls blob-reports/*.zip > /dev/null 2>&1; then
            npx playwright merge-reports --reporter html ./blob-reports
          fi

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Fail unless every viewport passed
        if: needs.e2e-shard.result != 'success'
        run: |
          echo "::error::e2e-shard finished as '${{ needs.e2e-shard.result }}'. Open the failing viewport's job."
          exit 1

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      # Lighthouse CI runs through npx at a pinned version rather than as a
      # dependency: its own dependencies carry advisories that would fail npm audit.
      - run: npm run lhci

      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm run build

      # LinkedIn answers bots with 999; the token avoids GitHub rate limits, and a
      # 429 after retries counts as reachable. The site's own domain is excluded:
      # its absolute URLs are the canonical and preview tags (checked by the
      # build-output tests), and a new page isn't live until its PR merges. Internal
      # links are root-relative and checked against dist/. The glob is quoted so
      # lychee expands it: the action's bash has no globstar.
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200..=299,429
            --root-dir ${{ github.workspace }}/dist
            --fallback-extensions html
            --exclude linkedin\.com
            --exclude '^https://(www\.)?leonardonunez\.dev'
            'dist/**/*.html'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for PII or hardcoded local paths
        env:
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          # Identifying patterns live in the PII_PATTERNS repository SECRET, not in this
          # file, so this public workflow doesn't publish what it protects. It must be a
          # secret, not a variable: Actions prints a step's env: block unmasked at the top
          # of the log, and only secrets are masked. Dependabot runs read a Dependabot
          # secret of the same name. See
          # CLAUDE.md ground rule 3 for this repo's own PII exceptions. Only file:line
          # is ever printed below, never the matched content, so a real hit doesn't
          # get echoed into a public Actions log either. PII_PATTERNS isn't passed to
          # workflows triggered by a fork PR, so that case falls back to a
          # local-path-only check rather than failing or silently skipping.
          EXCLUDE='^(\.github/|.*CLAUDE\.md$)'
          FILES=$(git ls-files | grep -vE "$EXCLUDE" || true)

          PII_HITS=""
          if [ -n "$PII_PATTERNS" ]; then
            PATTERN_FILE=$(mktemp)
            # tr: CRLF would leave "\r" on every pattern so none match; sed: an empty
            # line is an empty fixed string, which matches every line.
            printf '%s\n' "$PII_PATTERNS" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$PATTERN_FILE"
            PII_HITS=$(echo "$FILES" | xargs -r grep -Hn -iF -f "$PATTERN_FILE" 2>/dev/null | cut -d: -f1,2 || true)
          else
            echo "::warning::PII_PATTERNS secret is not available (expected on fork PRs) — skipping identifier check, only checking local paths."
          fi

          PATH_HITS=$(echo "$FILES" | xargs -r grep -Hn -E 'C:\\Users|C:/Users' | cut -d: -f1,2 || true)

          if [ -n "$PII_HITS" ] || [ -n "$PATH_HITS" ]; then
            [ -n "$PII_HITS" ] && echo "$PII_HITS"
            [ -n "$PATH_HITS" ] && echo "$PATH_HITS"
            echo "::error::Found a possible PII or hardcoded-path leak — see CLAUDE.md ground rule 3."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
